[project]
name = "rfc-chat"
version = "0.1.0"
description = "RAG chat over RFC PDFs with a 20-question retrieval evaluation."
authors = [
    { name = "Dheightsan", email = "273783572+Dheightsan@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pypdf>=7.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
rfc-chat = "rfc_chat.cli:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

